name: Build Electron EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    defaults:
      run:
        working-directory: ./POS-System
        shell: bash

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Build Python Backend
      working-directory: ./backend
      run: |
        pip install -r requirements.txt
        pyinstaller --noconfirm --onefile --windowed --name server --add-data "schema.sql;." run.py
        cp dist/server.exe ../POS-System/server.exe
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: './POS-System/package-lock.json'

    - name: Install dependencies
      run: npm ci || npm install

    - name: Build React and Electron App
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: npm run build-app -- --win

    - name: Upload Windows EXE
      uses: actions/upload-artifact@v4
      with:
        name: TEHZEEB-POS-Windows-EXE
        path: ./POS-System/dist_desktop/*.exe
