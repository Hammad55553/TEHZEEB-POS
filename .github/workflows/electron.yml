name: Build Electron EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    defaults:
      run:
        working-directory: ./POS-System

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: './POS-System/package-lock.json'

    - name: Install dependencies
      run: npm install

    - name: Build React and Electron App
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: npm run build-app -- --win

    - name: Upload Windows EXE
      uses: actions/upload-artifact@v3
      with:
        name: TEHZEEB-POS-Windows-EXE
        path: ./POS-System/dist_desktop/*.exe
